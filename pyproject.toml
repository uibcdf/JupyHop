[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyhop"
version = "0.1.0.dev0"
description = "SSH-native access to remote Jupyter sessions (SSH diagnostics milestone)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "JupyHop contributors, UIBCDF"}]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
jupyhop = "jupyhop.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.18", "mypy>=1.15,<3", "build>=1.2,<2"]
experiments = ["jupyter_server==2.21.1", "ipykernel==7.4.0", "requests==2.34.2", "websocket-client==1.9.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jupyhop = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = ["integration: opt-in disposable loopback SSH integration"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/jupyhop"]
strict = true
