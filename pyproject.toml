[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyhop"
version = "0.3.0"
description = "Discover, launch and open user-owned remote Jupyter servers through OpenSSH"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "JupyHop contributors, UIBCDF"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
jupyhop = "jupyhop.cli:main"

[project.urls]
Repository = "https://github.com/uibcdf/jupyhop"
Documentation = "https://www.uibcdf.org/jupyhop/"
Issues = "https://github.com/uibcdf/jupyhop/issues"

[project.optional-dependencies]
docs = ["sphinx>=9.2,<9.3", "myst-parser>=5.1,<5.2", "pydata-sphinx-theme>=0.24,<0.25", "sphinx-copybutton>=0.5.2,<0.6"]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.18", "mypy>=1.15,<3", "build>=1.2,<2", "setuptools>=77"]
experiments = ["jupyter_server==2.21.1", "jupyterlab==4.6.4", "ipykernel==7.4.0", "requests==2.34.2", "websocket-client==1.9.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jupyhop = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = ["integration: opt-in disposable loopback SSH integration"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/jupyhop"]
strict = true
