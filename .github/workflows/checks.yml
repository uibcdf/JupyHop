name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The installed-client upgrade builds its trusted baseline commit.
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y openssh-server tmux xdg-utils
      - run: sudo mkdir -p /run/sshd
      - run: python -m pip install -e '.[dev,experiments]'
      - run: ruff check . && ruff format --check . && mypy
      - name: Prepare isolated account fixture
        if: matrix.python == '3.14'
        run: |
          fixture_root="$(python -c 'from experiments.m5_accounts import prepare; print(prepare())')"
          echo "JUPYHOP_TEST_ROOT=$fixture_root" >> "$GITHUB_ENV"
          sudo /usr/bin/python3 -m experiments.m5_accounts provision --root "$fixture_root" --password-auth
          python -m experiments.m5_accounts check --root "$fixture_root"
      - name: Verify real Unix account isolation
        if: matrix.python == '3.14'
        run: |
          server_python="$(python -c 'import sys; print(sys.executable)')"
          python -m experiments.m5_account_acceptance --root "$JUPYHOP_TEST_ROOT" --server-python "$server_python"
      - name: Verify default SSH configuration permission feedback
        if: matrix.python == '3.14'
        run: python -m experiments.ssh_permissions_smoke --root "$JUPYHOP_TEST_ROOT"
      - name: Verify native Unix SSH password workflows
        if: matrix.python == '3.14'
        run: |
          server_python="$(python -c 'import sys; print(sys.executable)')"
          python -m experiments.password_smoke --root "$JUPYHOP_TEST_ROOT" --server-python "$server_python"
      - name: Remove isolated account fixture
        if: always() && matrix.python == '3.14' && env.JUPYHOP_TEST_ROOT != ''
        run: |
          if sudo test -f "/run/$(basename "$JUPYHOP_TEST_ROOT")/state.json"; then
            sudo /usr/bin/python3 -m experiments.m5_accounts cleanup --root "$JUPYHOP_TEST_ROOT"
          fi
          rm -rf -- "$JUPYHOP_TEST_ROOT"
      - run: pytest --run-integration
      - run: python -m build
      - run: python -m experiments.release_check
      - run: python -m experiments.package_smoke
      - name: Verify installed client upgrade from 0.1.0 using the actual candidate
        run: |
          candidate_wheel="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("jupyhop-*.whl")))')"
          python -m experiments.client_upgrade --candidate-wheel "$candidate_wheel"
      - name: Verify installed client upgrade from published 0.2.0 source
        run: |
          candidate_wheel="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("jupyhop-*.whl")))')"
          python -m experiments.client_upgrade --candidate-wheel "$candidate_wheel" --baseline-ref 6e0438eeb39a3bc8b92acb48545e55b343b52279
      - name: Verify both directions of installed 0.3.0 compatibility
        run: |
          candidate_wheel="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("jupyhop-*.whl")))')"
          python -m experiments.client_upgrade --candidate-wheel "$candidate_wheel" --baseline-ref 9a50bef3d5144420ccb0c5776d1158b4e1a76613 --reverse-managed
      - if: matrix.python == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: jupyhop-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
      - if: matrix.python == '3.14'
        run: google-chrome --version && python -m experiments.browser_smoke
      - if: matrix.python == '3.14'
        run: python -m experiments.browser_smoke --managed --reconnect
      - name: Check installed automatic access in Chrome and Firefox
        if: matrix.python == '3.14'
        run: |
          browser_dir="$RUNNER_TEMP/jupyhop-browsers"
          mkdir -m 700 "$browser_dir"
          curl --fail --silent --show-error --location --max-time 120 \
            https://download-installer.cdn.mozilla.net/pub/firefox/releases/160.0/linux-x86_64/en-US/firefox-160.0.tar.xz \
            --output "$browser_dir/firefox.tar.xz"
          curl --fail --silent --show-error --location --max-time 90 \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.0/geckodriver-v0.37.0-linux64.tar.gz \
            --output "$browser_dir/geckodriver.tar.gz"
          (
            cd "$browser_dir"
            sha256sum --check <<'CHECKSUMS'
          fde774e9757c8878534c05ec210db592bf6a1b244c57941ffb2e364c04f35fcd  firefox.tar.xz
          90d4e33bd9816684400c160d1309aaffec23a3f65103511d5a62d8501062e548  geckodriver.tar.gz
          CHECKSUMS
            tar -xJf firefox.tar.xz
            tar -xzf geckodriver.tar.gz
          )
          python -m venv "$browser_dir/client"
          "$browser_dir/client/bin/python" -m pip install --no-index --no-deps dist/*.whl
          python -m experiments.managed_browser --client-python "$browser_dir/client/bin/python"
          python -m experiments.managed_browser --client-python "$browser_dir/client/bin/python" \
            --firefox "$browser_dir/firefox/firefox" --geckodriver "$browser_dir/geckodriver"
  server-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: ['2.17.0', '2.20.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y openssh-server tmux
      - run: sudo mkdir -p /run/sshd
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install 'jupyter_server==${{ matrix.server }}' 'tornado<6.5.9' 'ipykernel==7.4.0' 'requests==2.34.2' 'websocket-client==1.9.2'
      - if: matrix.server == '2.17.0'
        run: python -m experiments.m6_compatibility --server-python "$(command -v python)" --expect-start-refusal
      - if: matrix.server == '2.20.0'
        run: python -m experiments.m6_compatibility --server-python "$(command -v python)"
