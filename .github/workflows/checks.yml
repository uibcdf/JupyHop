name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: sudo mkdir -p /run/sshd
      - run: python -m pip install -e '.[dev,experiments]'
      - run: ruff check . && ruff format --check . && mypy
      - run: pytest --run-integration
      - run: python -m build
      - run: python -m experiments.package_smoke
