name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y openssh-server tmux
      - run: sudo mkdir -p /run/sshd
      - run: python -m pip install -e '.[dev,experiments]'
      - run: ruff check . && ruff format --check . && mypy
      - run: pytest --run-integration
      - run: python -m build
      - run: python -m experiments.package_smoke
      - if: matrix.python == '3.14'
        run: google-chrome --version && python -m experiments.browser_smoke
      - if: matrix.python == '3.14'
        run: python -m experiments.browser_smoke --managed --reconnect
      - name: Prepare isolated account fixture
        if: matrix.python == '3.14'
        run: |
          fixture_root="$(python -c 'from experiments.m5_accounts import prepare; print(prepare())')"
          echo "JUPYHOP_TEST_ROOT=$fixture_root" >> "$GITHUB_ENV"
          sudo /usr/bin/python3 -m experiments.m5_accounts provision --root "$fixture_root"
          python -m experiments.m5_accounts check --root "$fixture_root"
      - name: Verify real Unix account isolation
        if: matrix.python == '3.14'
        run: |
          server_python="$(python -c 'import sys; print(sys.executable)')"
          python -m experiments.m5_account_acceptance --root "$JUPYHOP_TEST_ROOT" --server-python "$server_python"
      - name: Remove isolated account fixture
        if: always() && matrix.python == '3.14' && env.JUPYHOP_TEST_ROOT != ''
        run: |
          if sudo test -f "/run/$(basename "$JUPYHOP_TEST_ROOT")/state.json"; then
            sudo /usr/bin/python3 -m experiments.m5_accounts cleanup --root "$JUPYHOP_TEST_ROOT"
          fi
          rm -rf -- "$JUPYHOP_TEST_ROOT"
