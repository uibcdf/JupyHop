{% extends "!layout.html" %}
{% block extrahead %}
{{ super() }}
<meta property="og:site_name" content="JupyHop" />
<meta property="og:type" content="website" />
<meta property="og:title" content="{{ title | striptags | e }} — JupyHop" />
{% if pageurl %}<meta property="og:url" content="{{ pageurl | e }}" />{% endif %}
<meta property="og:image" content="https://www.uibcdf.org/jupyhop/_static/share-card.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="JupyHop: remote notebooks in your local browser. Open, start, resume and manage through SSH." />
<meta name="twitter:card" content="summary_large_image" />
{% endblock %}
